[package]
name = "backfill"
version = "0.2.0"
description = "Consumes Kafka topics in time windows and archives the messages to object storage for cold storage."
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
aws-config = "1"
aws-sdk-s3 = "1"
bytes = "1"
chrono = "0.4"
ctrlc = "3"
dotenv = "0.15"
rdkafka = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[lints.rust]
# The codebase never resorts to `unsafe`; keep it that way at compile time.
unsafe_code = "forbid"

[lints.clippy]
# Panic-free hot path: these restriction lints make panoptic APIs hard errors.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
