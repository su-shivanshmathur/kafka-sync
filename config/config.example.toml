# kafka-sync — configuration reference
#
# This file enumerates every configuration option. Copy it to
# `config/development.toml` (or `config/<RUN_ENV>.toml` for another
# environment) and adjust the values to the target infrastructure.
# NEVER commit secrets here — the file may only hold non-secret defaults.
#
# Equivalent environment variables always win over file values:
#
#   RUN_ENV                  selects config/<RUN_ENV>.toml   (default "development")
#   KAFKA_BROKERS            [kafka] brokers
#   KAFKA_TOPICS             [kafka] topics
#   KAFKA_CONSUMER_GROUP     [kafka] consumer_group
#   SYNC_DURATION            [kafka] sync_duration_secs      (seconds, >= 1)
#   KAFKA_MAX_WINDOW_BYTES   [kafka] max_window_bytes        (bytes, >= 1)
#   OBJECT_STORAGE           [storage] provider   ("FileSystem"|"AWS"|"GCS")
#   STORAGE_ROOT             [storage.filesystem] path
#   CLOUD_BUCKET             [storage.aws] bucket  or  [storage.gcs] bucket
#   CLOUD_PATH               [storage.aws] path            (S3 key prefix)
#   AWS_REGION               [storage.aws] region
#   GCS_CREDENTIALS_PATH     [storage.gcs] credentials_path

[kafka]
# Comma-separated host:port bootstrap servers. REQUIRED (no default).
brokers = "localhost:9092"
# Consumer group name — determines offset continuity. REQUIRED (no default).
consumer_group = "kafka-sync-dev"
# Comma-separated topic list. REQUIRED (no default).
topics = "events"
# Window length in seconds. Default: 10.
sync_duration_secs = 10
# Per-topic in-memory buffer cap for one window, in bytes. Default: 268435456.
max_window_bytes = 268435456

[storage]
# Object storage provider: "FileSystem" | "AWS" | "GCS". Default: "FileSystem".
provider = "FileSystem"

# --- FileSystem (default; no auth) ---
[storage.filesystem]
# Local root directory. Optional; default "./logs" (git-ignored).
# path = "./logs"

# --- AWS S3 ---
[storage.aws]
# Target bucket. REQUIRED for AWS.
# bucket = "kafka-sync-dev-bucket"
# Required key prefix — objects land under s3://<bucket>/<path>/yyyy/mm/dd/…
# path = "kafka-sync"
# Region used to build the SDK client. REQUIRED for AWS.
# region = "eu-west-1"

# --- Google Cloud Storage ---
[storage.gcs]
# Target bucket. REQUIRED for GCS.
# bucket = "kafka-sync-dev-bucket"
# Service-account JSON key file. REQUIRED for GCS (keep it out of version
# control; point at a secret-mounted path).
# credentials_path = "/path/to/service-account.json"
